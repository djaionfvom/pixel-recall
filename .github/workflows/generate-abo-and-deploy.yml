name: Generate ABO library and deploy Pixel Recall

on:
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Maximum ABO catalog images to inspect"
        required: true
        default: "30000"
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pixel-recall-abo-generation
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-real-objects.txt

      - name: Restore ABO download cache
        uses: actions/cache@v6
        with:
          path: .abo-cache
          key: abo-catalog-v1-${{ runner.os }}-${{ inputs.max_downloads }}
          restore-keys: |
            abo-catalog-v1-${{ runner.os }}-

      - name: Install generator dependencies
        run: python -m pip install -r requirements-real-objects.txt

      - name: Generate ranked, disjoint Daily and Run libraries
        run: >-
          python tools/abo_pattern_pipeline.py build
          --target-count 2190
          --max-downloads "${{ inputs.max_downloads }}"
          --max-listings-per-label 500
          --output-dir abo-output
          --js-output real-object-patterns.generated.js
          --asset-dir assets/abo

      - name: Validate generated output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("abo-output/summary.json").read_text())
          expected = {
              "uniqueSelected": 2190,
              "dailySelected": 1095,
              "runSelected": 1095,
              "dailyRunOverlap": 0,
          }
          for key, value in expected.items():
              actual = summary.get(key)
              if actual != value:
                  raise SystemExit(f"Validation failed: {key}={actual!r}, expected {value!r}")

          assets = list(Path("assets/abo").glob("abo-*.webp"))
          if len(assets) != 2190:
              raise SystemExit(f"Validation failed: found {len(assets)} WebP assets, expected 2190")

          js = Path("real-object-patterns.generated.js").read_text(encoding="utf8")
          for marker in (
              "window.PIXEL_RECALL_REAL_OBJECT_BANKS",
              "window.PIXEL_RECALL_RUN_OBJECTS",
              '"poolsOverlap": false',
          ):
              if marker not in js:
                  raise SystemExit(f"Validation failed: missing {marker}")
          print("Generated library validated: 1,095 Daily + 1,095 Run, zero overlap.")
          PY

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          rm -rf .pages
          mkdir .pages
          rsync -a ./ .pages/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.abo-cache' \
            --exclude '.venv-abo' \
            --exclude '.pages' \
            --exclude 'abo-output' \
            --exclude 'tools' \
            --exclude 'BUILD-ABO-WINDOWS.bat' \
            --exclude 'BUILD-ABO-MAC-LINUX.command' \
            --exclude 'requirements-real-objects.txt' \
            --exclude 'start-local-windows.bat' \
            --exclude 'start-local.command'
          touch .pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy new site only after successful generation
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Save generated library back to the repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real-object-patterns.generated.js assets/abo \
            abo-output/summary.json \
            abo-output/selected-sources.csv \
            abo-output/selected-sources.json \
            abo-output/daily-contact-sheet.png \
            abo-output/run-contact-sheet.png
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
          else
            git commit -m "Generate ABO Daily and Run libraries"
            git push
          fi
