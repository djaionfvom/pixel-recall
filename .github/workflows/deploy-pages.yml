name: Deploy Pixel Recall to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pixel-recall-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check whether the generated ABO library exists
        id: abo
        shell: bash
        run: |
          count=0
          if [ -d assets/abo ]; then
            count="$(find assets/abo -maxdepth 1 -name 'abo-*.webp' | wc -l | tr -d ' ')"
          fi
          if [ "$count" = "2190" ] && grep -q 'window.PIXEL_RECALL_RUN_OBJECTS' real-object-patterns.generated.js; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Generated ABO library is ready."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ABO library is not generated yet; skipping ordinary Pages deployment."
            echo "Run 'Generate ABO library and deploy Pixel Recall' once first."
          fi

      - name: Prepare static Pages artifact
        if: steps.abo.outputs.ready == 'true'
        shell: bash
        run: |
          rm -rf .pages
          mkdir .pages
          rsync -a ./ .pages/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.abo-cache' \
            --exclude '.venv-abo' \
            --exclude '.pages' \
            --exclude 'abo-output' \
            --exclude 'tools' \
            --exclude 'BUILD-ABO-WINDOWS.bat' \
            --exclude 'BUILD-ABO-MAC-LINUX.command' \
            --exclude 'requirements-real-objects.txt' \
            --exclude 'start-local-windows.bat' \
            --exclude 'start-local.command'
          touch .pages/.nojekyll

      - name: Configure GitHub Pages
        if: steps.abo.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.abo.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

      - name: Deploy
        if: steps.abo.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
