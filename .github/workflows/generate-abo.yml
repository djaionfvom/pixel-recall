name: Generate ABO library and refresh Pixel Recall

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-abo.yml"
      - "tools/**"
      - "requirements-real-objects.txt"
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Number of unique ABO catalog images to inspect"
        required: true
        default: "30000"
        type: string
      workers:
        description: "Parallel image workers"
        required: true
        default: "16"
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: pixel-recall-abo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MAX_DOWNLOADS: ${{ inputs.max_downloads || '30000' }}
      ABO_WORKERS: ${{ inputs.workers || '16' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-real-objects.txt

      - name: Restore ABO download cache
        uses: actions/cache@v6
        with:
          path: .abo-cache
          key: abo-catalog-v3-${{ runner.os }}-${{ env.MAX_DOWNLOADS }}
          restore-keys: |
            abo-catalog-v3-${{ runner.os }}-
            abo-catalog-v2-${{ runner.os }}-

      - name: Install generator dependencies
        run: python -m pip install -r requirements-real-objects.txt

      - name: Generate ABO Daily and Run objects
        run: >-
          python tools/abo_pattern_pipeline.py build
          --target-count 2190
          --max-downloads "$MAX_DOWNLOADS"
          --workers "$ABO_WORKERS"
          --max-listings-per-label 5000
          --output-dir abo-output
          --js-output real-object-patterns.generated.js
          --asset-dir assets/abo

      - name: Validate full or partial generated library
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("abo-output/summary.json").read_text())
          selected = int(summary.get("uniqueSelected", 0))
          daily = int(summary.get("dailySelected", 0))
          run = int(summary.get("runSelected", 0))
          overlap = int(summary.get("dailyRunOverlap", -1))
          bank_sizes = summary.get("dailyBankSizes", [])

          if selected < 4:
              raise SystemExit(f"Validation failed: only {selected} usable patterns")
          if daily < 3 or run < 1:
              raise SystemExit(f"Validation failed: Daily={daily}, Run={run}; both modes must remain playable")
          if overlap != 0:
              raise SystemExit(f"Validation failed: Daily/Run overlap={overlap}")
          if len(bank_sizes) != 3 or any(int(x) < 1 for x in bank_sizes):
              raise SystemExit(f"Validation failed: invalid Daily bank sizes {bank_sizes!r}")
          if daily + run != selected:
              raise SystemExit(f"Validation failed: Daily+Run != selected ({daily}+{run}!={selected})")

          assets = list(Path("assets/abo").glob("abo-*.webp"))
          if len(assets) != selected:
              raise SystemExit(f"Validation failed: found {len(assets)} WebP assets, expected {selected}")

          js = Path("real-object-patterns.generated.js").read_text(encoding="utf8")
          required = (
              "window.PIXEL_RECALL_REAL_OBJECT_BANKS",
              "window.PIXEL_RECALL_RUN_OBJECTS",
              '"poolsOverlap": false',
          )
          for marker in required:
              if marker not in js:
                  raise SystemExit(f"Validation failed: missing {marker}")

          state = "FULL" if selected >= 2190 else "PARTIAL"
          print(f"Validated {state} library: {daily} Daily-only + {run} Run-only = {selected}; zero overlap.")
          PY

      - name: Save generated library to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real-object-patterns.generated.js assets/abo \
            abo-output/summary.json \
            abo-output/selected-sources.csv \
            abo-output/selected-sources.json \
            abo-output/daily-contact-sheet.png \
            abo-output/run-contact-sheet.png

          if git diff --cached --quiet; then
            echo "Generated ABO library is already committed."
          else
            git commit -m "Generate ABO Daily and Run libraries"
            git push origin HEAD:main
          fi

      - name: Upload diagnostics if generation fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abo-generation-diagnostics
          path: |
            abo-output
            real-object-patterns.generated.js
          if-no-files-found: ignore
