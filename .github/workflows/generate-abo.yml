name: Generate ABO library and refresh Pixel Recall

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-abo.yml"
      - "tools/**"
      - "requirements-real-objects.txt"
      - "real-object-patterns.generated.js"
  workflow_dispatch:
    inputs:
      max_downloads:
        description: "Number of unique ABO catalog images to inspect"
        required: true
        default: "30000"
        type: string
      workers:
        description: "Parallel image workers"
        required: true
        default: "16"
        type: string

permissions:
  contents: write
  pages: write

concurrency:
  group: pixel-recall-abo-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MAX_DOWNLOADS: ${{ inputs.max_downloads || '30000' }}
      ABO_WORKERS: ${{ inputs.workers || '16' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-real-objects.txt

      - name: Restore ABO download cache
        uses: actions/cache@v6
        with:
          path: .abo-cache
          key: abo-catalog-v2-${{ runner.os }}-${{ env.MAX_DOWNLOADS }}
          restore-keys: |
            abo-catalog-v2-${{ runner.os }}-

      - name: Install generator dependencies
        run: python -m pip install -r requirements-real-objects.txt

      - name: Generate all ABO Daily and Run objects
        run: >-
          python tools/abo_pattern_pipeline.py build
          --target-count 2190
          --max-downloads "$MAX_DOWNLOADS"
          --workers "$ABO_WORKERS"
          --max-listings-per-label 500
          --output-dir abo-output
          --js-output real-object-patterns.generated.js
          --asset-dir assets/abo

      - name: Validate generated library
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("abo-output/summary.json").read_text())
          expected = {
              "uniqueSelected": 2190,
              "dailySelected": 1095,
              "runSelected": 1095,
              "dailyRunOverlap": 0,
          }
          for key, value in expected.items():
              actual = summary.get(key)
              if actual != value:
                  raise SystemExit(f"Validation failed: {key}={actual!r}, expected {value!r}")

          assets = list(Path("assets/abo").glob("abo-*.webp"))
          if len(assets) != 2190:
              raise SystemExit(f"Validation failed: found {len(assets)} WebP assets, expected 2190")

          js = Path("real-object-patterns.generated.js").read_text(encoding="utf8")
          required = (
              "window.PIXEL_RECALL_REAL_OBJECT_BANKS",
              "window.PIXEL_RECALL_RUN_OBJECTS",
              '"dailyCount": 1095',
              '"runCount": 1095',
              '"poolsOverlap": false',
          )
          for marker in required:
              if marker not in js:
                  raise SystemExit(f"Validation failed: missing {marker}")

          print("Validated: 1,095 Daily-only + 1,095 Run-only ABO objects, zero overlap.")
          PY

      - name: Save generated library to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add real-object-patterns.generated.js assets/abo \
            abo-output/summary.json \
            abo-output/selected-sources.csv \
            abo-output/selected-sources.json \
            abo-output/daily-contact-sheet.png \
            abo-output/run-contact-sheet.png

          if git diff --cached --quiet; then
            echo "Generated ABO library is already committed."
          else
            git commit -m "Generate ABO Daily and Run libraries"
            git push origin HEAD:main
          fi

      - name: Request a fresh branch-based GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Upload diagnostics if generation fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abo-generation-diagnostics
          path: |
            abo-output
            real-object-patterns.generated.js
          if-no-files-found: ignore
